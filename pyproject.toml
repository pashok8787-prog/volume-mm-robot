[project]
name = "volume-mm-robot"
version = "0.1.0"
description = "Двусторонний market-making робот для Aster DEX и Hyperliquid"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "aiohttp>=3.12",
    "pydantic>=2.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
live = [
    "eth-account>=0.13",
    "hyperliquid-python-sdk>=0.20",
]

[project.scripts]
volume-mm-robot = "volume_mm_robot.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/volume_mm_robot"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src"]
extend-exclude = [".cache", ".python", ".tools", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "ASYNC", "RUF"]
ignore = ["ANN401", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["src"]
